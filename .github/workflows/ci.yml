name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch/PR; a new push cancels the old run -- ON PULL REQUESTS ONLY.
#
# On `main` every push shares one ref, so back-to-back merges cancelled each other: merging PR #63
# while PR #62's merge-commit run was still in flight left commit 96f06a4 on `main` with NO completed
# CI run, and a8b296ab (PR #60's merge) the same way. "main is always green" (docs/04) then means
# "green at the tip", which is not what a bisect needs -- and this repo merges small PRs back to back,
# so it is the normal case rather than a corner. Superseding a PR's own iterations is still right and
# still saves the runner time; superseding a trunk commit's only verification is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege — this workflow only reads the repo.
permissions:
  contents: read

jobs:
  # Fast guard: the pinned vcpkg submodule and the manifest baseline must not drift.
  vcpkg-baseline:
    name: vcpkg baseline invariant
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (gitlink only — no submodule contents needed)
        uses: actions/checkout@v4
      - name: Submodule SHA must equal builtin-baseline
        shell: bash
        run: |
          submodule_sha="$(git rev-parse 'HEAD:vcpkg')"
          baseline="$(jq -r '.["builtin-baseline"]' vcpkg.json)"
          echo "submodule gitlink   : $submodule_sha"
          echo "vcpkg.json baseline : $baseline"
          if [ "$submodule_sha" != "$baseline" ]; then
            echo "::error file=vcpkg.json::vcpkg submodule SHA ($submodule_sha) != builtin-baseline ($baseline). Bump them together in one commit."
            exit 1
          fi

  lint:
    name: Format & lint configs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (no submodules — clang-format needs only the sources)
        uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: clang-format — all tracked C/C++ sources must be formatted
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx' '*.hxx' '*.inl' ':!:editor/third_party/**' \
            | xargs -0 -r clang-format-18 --dry-run --Werror

      - name: Boundary — no spdlog/fmt types in public engine headers
        shell: bash
        run: |
          set -euo pipefail
          # Task 0.2.4's deliverable: "no spdlog types in public headers". vcpkg installs every
          # dependency into ONE flat include dir that lands on the compile line (-isystem) of any
          # target linking any vcpkg package, so linking spdlog PRIVATE cannot enforce this —
          # a leaked #include would still compile. This grep is the actual enforcement.
          # Matches backend includes and qualified uses; 'format'/'std::format' do NOT match.
          #
          # The namespace arm is spelled (^|[^a-zA-Z0-9_]) and NOT \b on purpose — see the enkiTS
          # step below for the full reasoning. In short: `git grep -E` delegates to the SYSTEM POSIX
          # ERE engine, and \b is a GNU extension that BSD libc (macOS) degrades to a literal 'b',
          # making the arm silently vacuous there. This step shipped with \b at 0.2.4 and was fixed
          # once 0.2.5 discovered it. It was never broken in CI (this job runs on Linux/glibc), but
          # it could not fire for anyone running it locally on a Mac, and it would have rotted to a
          # no-op — green — the day the runner image changed.
          if git grep -n -E '(#[[:space:]]*include[[:space:]]*<(spdlog|fmt)/)|((^|[^a-zA-Z0-9_])(spdlog|fmt)::)' \
               -- 'engine/*/include/*'; then
            echo "::error::A third-party logging backend leaked into a public engine header (task 0.2.4; docs/04 boundary rule). Keep spdlog/fmt inside engine/core/src/log.cpp."
            exit 1
          fi

      - name: Boundary — no GLM outside the math backend
        shell: bash
        run: bash .github/scripts/check-math-boundary.sh

      - name: Boundary — no enkiTS types in public engine headers
        shell: bash
        run: |
          set -euo pipefail
          # Task 0.2.5's boundary: "no enkiTS type in a public engine header". Both spellings are
          # real and must be caught. enkiTS installs its headers to include/enkiTS/ and its exported
          # target puts include/enkiTS (not include/) on a consumer's compile line, so:
          #   <TaskScheduler.h>          resolves only for a target linking enkiTS::enkiTS;
          #   <enkiTS/TaskScheduler.h>   resolves for ANY target linking ANY vcpkg package, because
          #                              vcpkg installs every port into ONE flat include/ root that
          #                              lands on that target's compile line (-isystem) — risk R12.
          # The second is why linking enkiTS PRIVATE cannot enforce this on its own: a leaked
          # #include would still compile in tests/. This grep reaches where the compile-time probe
          # (tests/jobs_boundary_probe.cpp) cannot.
          #
          # The namespace arm is spelled (^|[^a-zA-Z0-9_])enki:: and NOT \benki:: on purpose.
          # `git grep -E` delegates to the SYSTEM POSIX ERE engine: glibc accepts \b as a GNU
          # extension, but BSD libc (macOS) does not — there \b degrades to a literal 'b', so
          # \benki:: only ever matches "benki::" and the arm is silently vacuous. The lint job runs
          # on Linux, where \b would work, but a guard that no-ops the moment anyone runs it locally
          # or the runner changes is exactly the silent-green rot this task's probes exist to
          # prevent. The bracket form is an exact equivalent and is portable everywhere.
          # (Verified 2026-07-15: it catches `enki::` at line start / after a space, `<`, or `(`,
          # and rejects `benki::`, `myenki::`, `x_enki::`, and the word "enkiTS" in prose — which
          # jobs.hpp's comments legitimately use.)
          if git grep -n -E '(#[[:space:]]*include[[:space:]]*<enkiTS/)|(#[[:space:]]*include[[:space:]]*<(TaskScheduler|TaskScheduler_c|LockLessMultiReadPipe)\.h>)|((^|[^a-zA-Z0-9_])enki::)' \
               -- 'engine/*/include/*'; then
            echo "::error::enkiTS leaked into a public engine header (task 0.2.5; docs/04 boundary rule). Keep enkiTS inside engine/core/src/jobs.cpp."
            exit 1
          fi

      - name: Boundary — no SDL types in public engine headers
        shell: bash
        # Task 0.3.1's boundary: "no SDL type in a public engine header". A plain grep (the
        # spdlog/enkiTS precedent above) does NOT work for SDL: SDL has no namespace, so a real SDL
        # identifier (SDL_Init, SDL_GPU, SDL_Window, ...) is textually indistinguishable from that
        # same identifier cited in a documentation comment — and this codebase already cites exact
        # SDL identifiers in prose for traceability (e.g. math.hpp's "SDL_GPU's documented NDC",
        # time.hpp's "SDL_GetTicks", this task's own context.hpp citing "SDL_init.h:81"). A bare
        # `(^|[^a-zA-Z0-9_])SDL_` grep fires on ALL of those — verified during 0.3.1 implementation:
        # it already matched on main before this task added a single line, entirely from pre-existing
        # math/time comments, which would have made this step permanently red. spdlog/enkiTS don't
        # have this problem because `spdlog::`/`enki::`/`TaskScheduler.h` essentially never appear in
        # first-party prose. check-platform-boundary.sh strips `//` line comments before applying the
        # identifier check (mirroring check-math-boundary.sh's script-not-one-liner precedent for a
        # boundary that needs more nuance than a single grep line), so a real leak (an actual
        # `#include <SDL3/...>` or an actual `SDL_Window*` declaration) still fails the build, while a
        # documentation citation does not.
        run: bash .github/scripts/check-platform-boundary.sh

      - name: Boundary — no SDL_GPU outside the rhi backend
        shell: bash
        # Task 0.4.5 (ADR-002, the sacred wrapper): SDL_GPU is reachable from exactly one TU,
        # engine/rhi/src/sdl_gpu_backend.cpp. Like check-platform-boundary.sh this is a script, not a
        # one-line grep, because SDL has no namespace and this codebase cites SDL_GPU identifiers in
        # first-party comments -- the script strips `//` comments before the identifier check. Unlike
        # the platform guard it scans engine/ + runtime/ SOURCES (not just public headers) with a
        # single allowlisted file: the sacred-wrapper invariant governs .cpp too, not only headers.
        run: bash .github/scripts/check-rhi-boundary.sh

      - name: Boundary — no entt types in public engine headers
        shell: bash
        # Task 1.3.1 (project rule #3, docs/04 boundary check #9): EnTT is the fifth private backend
        # behind an engine layer (after glm, spdlog/fmt, enkiTS, SDL3/miniaudio, SDL_GPU). Like the
        # platform and rhi guards this is a SCRIPT, not a bare grep, because the scene headers cite
        # entt::basic_registry in first-party prose for traceability — the script strips `//` comments
        # before the identifier check. Its scope is PUBLIC HEADERS ONLY (engine/*/include/*), NOT all
        # engine sources: docs/03 designates engine/reflect the future "entt::meta runtime", so a
        # source-scope confinement would outlaw a documented future layer by accident. Widening it is
        # a separate, deliberate decision (spec §6). The compile-time half is
        # tests/scene_boundary_probe.cpp, which links aero::scene alone.
        run: bash .github/scripts/check-scene-boundary.sh

      - name: Golden rule — /engine and /runtime must never reference /editor
        shell: bash
        # Task 2.1.2 (project rule #1, docs/00 / docs/03; docs/04 guard table). Like the platform,
        # rhi and scene guards this is a SCRIPT, not a bare grep: engine/ + runtime/ already carry 22
        # first-party PROSE citations of the word "editor" (all // or # comments), so a bare token
        # grep is permanently red -- the script strips `//` comments before the namespace check. Two
        # arms: an #include whose path contains `editor` as a whole PATH SEGMENT (the relative-escape
        # form is the only include form that compiles today -- editor/include is on no engine compile
        # line), and an `engine::editor` / `namespace editor` spelling used as CODE (the
        # forward-declaration hole, which no include scan can see).
        #
        # This is the TEXTUAL half only. The LINK and INCLUDE-DIRECTORY half is
        # cmake/golden_rule.cmake's aero_assert_golden_rule(), which runs inside every `build` lane's
        # configure -- not here. An engine target linking an editor target is a textbook rule-#1
        # violation that is invisible to any #include scan.
        run: bash .github/scripts/check-golden-rule.sh

      - name: Project and asset flows — no delete/rename/copy
        shell: bash
        # Sixth architecture guard (task 2.6.1, code-review round; D7/INV-P4; widened by task 3.1.1 to
        # cover the asset flow's D7/D8, and by task 3.1.2 to cover the import cache's D18). A
        # createProject failure must never remove, rename or copy anything it already created, on any
        # failure path; an invalid .meta is never overwritten and an orphaned .meta is never deleted;
        # a stale cache entry is discarded from the in-memory index, never removed as a file. Like the
        # platform/rhi/scene/golden-rule guards this is a SCRIPT, not a bare grep, so a comment
        # explaining WHY a call is forbidden never trips the check it is describing. Scoped to exactly
        # six named files across the three flows (editor/src/project.cpp, project_file.cpp,
        # project_ui.cpp, asset_meta.cpp, asset_database.cpp, asset_cache.cpp), not a glob over
        # editor/src/ -- the invariant is specific to these three flows. The script's name is narrower
        # than its scope for historical reasons (a rename was considered and rejected, see the
        # script's own header). Proven red-on-violation by the hermetic ctest case
        # project-no-delete.no_delete_e2e.
        run: bash .github/scripts/check-project-no-delete.sh

  build:
    name: ${{ matrix.name }}
    needs: vcpkg-baseline        # don't spend build minutes if the pin is broken
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # one OS failing must not cancel the others
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            preset: linux
            vcpkg_cache: ~/.cache/vcpkg/archives
            shadercross_cache: ~/.cache/aero-engine/shadercross  # task 0.4.3
            ctest_launcher: xvfb-run -a  # D6: GPU device creation needs a REAL video driver (x11)
            require_gpu: 1               # task 0.4.2 (D7): a missing GPU device is a FAILURE, not a skip
          - name: macOS (AppleClang)
            os: macos-15
            preset: macos
            vcpkg_cache: ~/.cache/vcpkg/archives
            shadercross_cache: ~/.cache/aero-engine/shadercross  # task 0.4.3
            ctest_launcher: ""
            require_gpu: 1
          - name: Windows (MSVC)
            os: windows-2022
            preset: windows
            vcpkg_cache: ~/AppData/Local/vcpkg/archives
            shadercross_cache: ~/AppData/Local/aero-engine/shadercross  # task 0.4.3
            ctest_launcher: ""
            require_gpu: 1
    steps:
      - name: Checkout with vcpkg submodule
        uses: actions/checkout@v4
        with:
          submodules: true         # required — the toolchain lives in the submodule

      - name: Install SDL3 system dependencies (Linux)
        if: runner.os == 'Linux'
        # SDL3's Linux build deps for the enabled x11 + wayland features (X11 extension libs,
        # wayland-protocols, libdecor, egl, ibus — per SDL3 README-linux), plus autotools + libltdl-dev
        # that vcpkg needs to build transitive deps (SDL3 → dbus[systemd] → libsystemd → libxcrypt, libmount, …).
        # task 0.4.2: mesa-vulkan-drivers + libvulkan1 give SDL_GPU's Vulkan backend a software ICD
        # (lavapipe) on these GPU-less runners — the standard headless-GPU CI pattern; xvfb gives D6's
        # required REAL video driver (dummy has no Vulkan/Metal surface support) and a displayable
        # window for the tier-2 swapchain tests.
        # task 1.1.1: libclang-18-dev + llvm-18-dev give tools/reflect-gen system libclang (the C API +
        # headers + the CMake config packages) at the AERO_LLVM_ROOT default (/usr/lib/llvm-18) — no
        # env override needed on this lane.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxft-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libxkbcommon-dev \
            libegl1-mesa-dev libibus-1.0-dev \
            autoconf autoconf-archive automake libtool libltdl-dev \
            clang-tidy-18 libclang-18-dev llvm-18-dev \
            mesa-vulkan-drivers libvulkan1 xvfb

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        # task 1.1.1: tools/reflect-gen's system-libclang discovery hints brew --prefix llvm@18
        # (AERO_LLVM_ROOT's macOS default) — idempotent; the macos-15 image may already carry it.
        run: brew install llvm@18

      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        # task 1.1.1: pinned to match the other two lanes' LLVM 18 line (D2). AERO_LLVM_ROOT is
        # exported for the configure steps (plan C.2) as belt-and-suspenders on top of the
        # $ENV{ProgramFiles}/LLVM default, in case choco's install location ever drifts from it.
        # --allow-downgrade: the windows-2022 runner ships a newer LLVM preinstalled (20.1.8 as of
        # 2026-07), so choco refuses to install the pinned older 18.1.8 over it without this flag
        # (choco's own error names it). This is the plan's pre-decided Windows contingency
        # (D10/§S6) -- keep the LLVM 18 pin rather than let the Windows lane parse with a different
        # frontend than Linux/macOS and the repo's own clang-tidy-18.
        shell: bash
        run: |
          choco install llvm --version=18.1.8 -y --allow-downgrade
          echo "AERO_LLVM_ROOT=C:\Program Files\LLVM" >> "$GITHUB_ENV"

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1   # optional hardening: pin to a full commit SHA (§5 step 7)
        with:
          arch: x64

      - name: Remove MSYS link shadow (Windows)
        if: runner.os == 'Windows'
        # Git Bash ships /usr/bin/link, which shadows MSVC's link.exe under
        # shell:bash (documented in the ilammy/msvc-dev-cmd README). 0.1.4
        # adds the repo's first linked target, so the shadow can bite starting
        # here. -f: succeed even if a future image drops the file.
        shell: bash
        run: rm -f /usr/bin/link

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ matrix.vcpkg_cache }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-

      - name: Cache shader toolchain (task 0.4.3)
        uses: actions/cache@v4
        with:
          path: ${{ matrix.shadercross_cache }}
          key: shadercross-${{ runner.os }}-1ca46e0ef7a9
          # No restore-keys: a SHA bump must rebuild the toolchain from scratch, never resurrect a
          # stale one under a partial key match.

      - name: Configure & build — Debug
        shell: bash                 # -eo pipefail: a failed configure aborts before build
        run: |
          cmake --preset ${{ matrix.preset }}-debug
          cmake --build --preset ${{ matrix.preset }}-debug

      - name: clang-tidy — first-party TUs (Linux, reuses the Debug compile DB)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Only .cpp are translation units; the compile DB from linux-debug carries
          # their exact flags. profiler.hpp is linted transitively via profiler_test.cpp.
          git ls-files -z '*.cpp' \
            | xargs -0 -r -n1 clang-tidy-18 -p build/linux-debug --warnings-as-errors='*'

      - name: Test — Debug (ASan/UBSan)
        shell: bash
        env:
          AERO_REQUIRE_GPU: ${{ matrix.require_gpu }}   # a missing GPU is a FAILURE, not a skip (spec D7)
          # Evidence-gated LSan suppressions (spec D16, exercised by PR #16's first GPU run): SDL's
          # x11 video-init and Vulkan-probe internals leak per init cycle; tests/lsan.supp names the
          # four observed third-party frames. Linux-only — the one lane where LSan runs; empty
          # elsewhere. First-party leak detection stays fully on.
          LSAN_OPTIONS: ${{ runner.os == 'Linux' && format('suppressions={0}/tests/lsan.supp', github.workspace) || '' }}
        run: ${{ matrix.ctest_launcher }} ctest --preset ${{ matrix.preset }}-debug

      - name: Configure & build — Release
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }}-release
          cmake --build --preset ${{ matrix.preset }}-release

      - name: Test — Release
        shell: bash
        env:
          AERO_REQUIRE_GPU: ${{ matrix.require_gpu }}   # a missing GPU is a FAILURE, not a skip (spec D7)
        run: ${{ matrix.ctest_launcher }} ctest --preset ${{ matrix.preset }}-release

      - name: Upload the cooked artifacts for the cook-determinism job
        # task 3.3.3. Consumed by the `cook-determinism` job below, which byte-compares the three
        # lanes' copies against each other with both sides physically present -- the one thing no
        # ctest case can do, however many lanes it runs on.
        #
        # THE FOUR PATHS ARE THE SINGLE COUPLING POINT between this step and that job. If any
        # manifest case is renamed or its output layout moves, three places change together: the case
        # names in tests/CMakeLists.txt, these four paths, and the job's directory expectations.
        #
        # `artifacts/` is a SUBDIRECTORY on purpose. Each case's WORK_DIR also holds its perturbed
        # re-cook and the alternate working directory that re-cook runs from; uploading the WORK_DIRs
        # themselves would put extra files in the set and fail the job's exact-count check with a
        # message about extras that has nothing to do with determinism.
        #
        # upload-artifact@v4 roots the archive at the least common ancestor of all supplied paths, so
        # each lane's artifact reads:
        #     golden_manifest/artifacts/           6 .aeromesh files
        #     texture_golden_manifest/artifacts/   8 .ktx2 files
        #     skeleton_golden_manifest/artifacts/  1 .aeroskel file
        #     animation_golden_manifest/artifacts/ 3 .aeroanim files
        # Release rather than Debug for one reason only: Release tests run last, so this is the tree
        # just exercised. Both configurations are already manifest-checked by the four ctest cases,
        # so nothing rides on the choice.
        uses: actions/upload-artifact@v4
        with:
          name: cook-determinism-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}-release/tests/cooker/golden_manifest/artifacts/
            build/${{ matrix.preset }}-release/tests/cooker/texture_golden_manifest/artifacts/
            build/${{ matrix.preset }}-release/tests/cooker/skeleton_golden_manifest/artifacts/
            build/${{ matrix.preset }}-release/tests/cooker/animation_golden_manifest/artifacts/
          retention-days: 7            # the consuming job runs minutes later; a week covers a re-run
          if-no-files-found: error     # an empty upload is a broken contract, not a quiet skip

  # Cross-lane cook determinism (task 3.3.3). Three things no ctest case can provide, and nothing else:
  #
  #   1. THE THREE LANES' ACTUALLY-PRODUCED BYTES, COMPARED WITH BOTH SIDES PRESENT. The four manifest
  #      cases already prove every lane and both configurations equal the frozen expectation, and
  #      therefore each other -- but that is a transitive argument, and this is the one place in the
  #      project where "macOS == Windows == Linux, byte for byte" is a single green check somebody can
  #      point at. 18 names x 2 lane pairs = 36 comparisons, all required.
  #   2. A SECOND, FOREIGN IMPLEMENTATION OF THE FROZEN EXPECTATION. coreutils sha256sum, not CMake's
  #      file(SHA256), so a defect in our own hashing or manifest parsing cannot self-confirm.
  #   3. CONTINUOUS EXTERNAL CONFORMANCE. A pinned Khronos ktx validate over every cooked .ktx2. The
  #      sRGB DFD defect class is invisible to every internal test BY CONSTRUCTION -- our parser
  #      compares the descriptor against the same table our writer emits -- and task 3.3.2's own
  #      validation pass proved a foreign validator sees it: re-seeding the corrected byte made
  #      ktx validate exit 3 with error-6028 naming qualifierLinear. This step keeps that running.
  #
  # WHAT IT DELIBERATELY DOES NOT DO. It builds nothing, so it costs seconds and cannot fail for a
  # reason unrelated to determinism. It never regenerates the manifest -- that ritual is local, manual
  # and documented in tests/cooker/determinism.sha256's own header. It validates ONE lane's copies,
  # because step 3 has just proven the three sets identical and validating the same bytes three times
  # proves nothing further. And there is no analogous external check for .aeromesh, because none
  # exists: it is a first-party format whose proof surface is its own hostile-input parser, its three
  # byte goldens, and this manifest.
  cook-determinism:
    name: Cook determinism (cross-lane)
    needs: build            # `build` sets fail-fast: false, so a red lane SKIPS this job rather than
    runs-on: ubuntu-24.04   # letting it compare two surviving lanes and call that a pass
    steps:
      - name: Checkout (no submodules — this job needs the manifest and nothing else)
        uses: actions/checkout@v4

      # Three explicit downloads rather than one `pattern:`, deliberately: a named download fails loudly
      # when its artifact is absent, whereas a pattern silently yields fewer sets and the count check
      # would then report a confusing "0 files" for a lane that never uploaded.
      - name: Download the Linux lane's artifacts
        uses: actions/download-artifact@v4
        with:
          name: cook-determinism-linux
          path: cooked/linux
      - name: Download the macOS lane's artifacts
        uses: actions/download-artifact@v4
        with:
          name: cook-determinism-macos
          path: cooked/macos
      - name: Download the Windows lane's artifacts
        uses: actions/download-artifact@v4
        with:
          name: cook-determinism-windows
          path: cooked/windows

      - name: Set equality — each lane holds exactly the manifest's eighteen artifacts
        shell: bash
        run: |
          set -euo pipefail
          # `grep -vE '^#|^$'` and not `grep -v '^#'`: the manifest has a blank line between its mesh
          # and texture blocks, and a blank line is an improperly formatted line to sha256sum -c
          # --strict. The name field starts at column 67 (64 hex + two spaces).
          names="$(grep -vE '^#|^$' tests/cooker/determinism.sha256 | cut -c67-)"
          count="$(printf '%s\n' "$names" | wc -l | tr -d ' ')"
          if [ "$count" -ne 18 ]; then
            echo "::error file=tests/cooker/determinism.sha256::the manifest lists $count artifacts, expected exactly 18"
            exit 1
          fi
          for lane in linux macos windows; do
            # The exact count comes FIRST: a future case writing an extra file into a manifest
            # WORK_DIR is invisible to a name-driven loop, and this is where it surfaces.
            found="$(find "cooked/$lane" -type f | wc -l | tr -d ' ')"
            if [ "$found" -ne 18 ]; then
              echo "::error::lane $lane uploaded $found files, expected exactly 18"
              find "cooked/$lane" -type f | sort
              exit 1
            fi
            mkdir -p "flat/$lane"
            while IFS= read -r name; do
              matches="$(find "cooked/$lane" -type f -name "$name")"
              if [ "$(printf '%s\n' "$matches" | grep -c . || true)" -ne 1 ]; then
                echo "::error::lane $lane does not hold exactly one '$name'"
                exit 1
              fi
              cp "$matches" "flat/$lane/$name"
            done <<< "$names"
            flat="$(find "flat/$lane" -type f | wc -l | tr -d ' ')"
            if [ "$flat" -ne 18 ]; then
              echo "::error::flattening lane $lane produced $flat files, expected 18"
              exit 1
            fi
          done
          echo "three lanes, eighteen artifacts each, flattened for comparison."

      - name: Cross-lane byte comparison — 36 cmp runs, all required
        shell: bash
        run: |
          set -euo pipefail
          comparisons=0
          # Process substitution, not a pipe: a piped `while` runs in a subshell and the counter would
          # be lost, which would make the anti-vacuity check below vacuous.
          while IFS= read -r name; do
            for other in macos windows; do
              if ! cmp -s "flat/linux/$name" "flat/$other/$name"; then
                echo "::error::$name DIFFERS between linux and $other"
                ls -l "flat/linux/$name" "flat/$other/$name"
                # cmp -l prints `<1-based byte offset> <octal linux> <octal other>` per differing byte.
                cmp -l "flat/linux/$name" "flat/$other/$name" | head -5 || true
                exit 1
              fi
              comparisons=$((comparisons + 1))
            done
          done < <(grep -vE '^#|^$' tests/cooker/determinism.sha256 | cut -c67-)
          if [ "$comparisons" -ne 36 ]; then
            echo "::error::$comparisons byte comparisons ran, expected exactly 36 (18 artifacts x 2 lane pairs)"
            exit 1
          fi
          echo "36 byte comparisons agreed: macOS == Windows == Linux, byte for byte."

      - name: The frozen manifest, re-checked by a second implementation
        shell: bash
        run: |
          set -euo pipefail
          # coreutils sha256sum rather than CMake's file(SHA256), on purpose: the four ctest cases and
          # this step are then two independent readings of the same expectation, and a defect in one
          # cannot confirm itself. --strict makes a malformed line a failure rather than a warning.
          grep -vE '^#|^$' tests/cooker/determinism.sha256 > "$RUNNER_TEMP/manifest.lines"
          lines="$(wc -l < "$RUNNER_TEMP/manifest.lines" | tr -d ' ')"
          if [ "$lines" -ne 18 ]; then
            echo "::error::the filtered manifest holds $lines lines, expected 18"
            exit 1
          fi
          ( cd flat/linux && sha256sum -c --strict "$RUNNER_TEMP/manifest.lines" )

      - name: Cache the pinned KTX-Software 4.4.2 tools
        id: ktx-cache
        uses: actions/cache@v4
        with:
          path: ktx-tools
          # Keyed on version AND checksum, so a re-pin cannot resurrect the old tree. No restore-keys,
          # for the same reason the shadercross cache above has none.
          key: ktx-4.4.2-a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245

      - name: Fetch and verify KTX-Software 4.4.2
        if: steps.ktx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # PINNED BY VERSION AND BY CHECKSUM. A floating "latest" would let an upstream release change
          # what this job means on a push that touched nothing; a pinned URL without a checksum would
          # let a substituted asset do the same silently. Bumping the validator is a deliberate PR that
          # changes the two literals below and the cache key above, together.
          # 4.4.2 is the exact version task 3.3.2's validation pass used to catch the sRGB DFD defect.
          # The SHA-1 of these same bytes is c6b08c817f8c8dd299deccae4f2fbb8d55e9acd2, which equals the
          # .sha1 sibling Khronos publishes beside the tarball -- so the pin is a statement about
          # Khronos's bytes rather than about whatever a CDN served twice.
          url='https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2'
          sha='a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245'
          command -v bzip2 >/dev/null || { echo "::error::bzip2 is not on this runner image"; exit 1; }
          curl -fsSL --retry 3 -o ktx.tar.bz2 "$url"
          echo "$sha  ktx.tar.bz2" | sha256sum -c -
          mkdir -p ktx-tools
          tar -xjf ktx.tar.bz2 -C ktx-tools

      - name: ktx validate — every cooked .ktx2 through a conforming external validator
        shell: bash
        run: |
          set -euo pipefail
          # warning-7010 ("Custom key in Key/Value Data -- AeroSourceGuid") is EXPECTED on every one of
          # these files: the key is deliberate and documented, and the diagnostic is a warning rather
          # than an error. No warnings-as-errors flag is passed here, on purpose.
          #
          # The binary is located rather than hard-coded, and the search is required to find EXACTLY
          # one: the tarball's internal layout is an upstream packaging choice, not a contract, and a
          # find that quietly picked the first of several would be a validator chosen by luck. (For
          # the record, 4.4.2 unpacks to KTX-Software-4.4.2-Linux-x86_64/{bin,lib,include,share} with
          # one bin/ktx and one real lib/libktx.so.4.4.2 behind two symlinks.)
          mapfile -t ktx_bins < <(find ktx-tools -type f -name ktx -perm -u+x)
          if [ "${#ktx_bins[@]}" -ne 1 ]; then
            echo "::error::found ${#ktx_bins[@]} ktx binaries under ktx-tools, expected exactly 1"
            find ktx-tools -maxdepth 4 | head -50
            exit 1
          fi
          ktx_bin="${ktx_bins[0]}"
          lib="$(find ktx-tools -type f -name 'libktx.so*' | head -1 || true)"
          if [ -n "$lib" ]; then
            export LD_LIBRARY_PATH="$(dirname "$lib")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          "$ktx_bin" --version
          # nullglob so a non-matching pattern expands to NOTHING rather than to itself. Without it
          # bash hands the literal string `flat/linux/*.ktx2` to the validator, which fails on a file
          # that does not exist -- a red step for the right reason but with the wrong diagnosis, and
          # it makes the counter below unreachable. With it, zero matches means zero iterations, which
          # is the case the literal 8 is actually here to catch.
          shopt -s nullglob
          validated=0
          for f in flat/linux/*.ktx2; do
            echo "--- $f"
            "$ktx_bin" validate "$f"
            validated=$((validated + 1))
          done
          # A LITERAL 8: with nullglob set, a glob that matched nothing loops zero times and would
          # otherwise leave this step green having validated nothing, which is exactly the shape a
          # conformance check must not have. It also catches 7 or 9 -- a lane that gained or lost an
          # artifact between the count check above and here.
          if [ "$validated" -ne 8 ]; then
            echo "::error::$validated .ktx2 artifacts validated, expected exactly 8"
            exit 1
          fi
          echo "8 cooked KTX2 artifacts accepted by Khronos ktx validate 4.4.2."
